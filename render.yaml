# Render Blueprint: free web service built from the root Dockerfile.
# Database: Aiven free MySQL. Photos: Cloudinary free plan.
# Steps: docs/deployment.md ("Free hosting").
services:
  - type: web
    name: cavendish-connect
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: cloudinary
      # Render creates long random values for these automatically.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # You paste these when Render asks:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
